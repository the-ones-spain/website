# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to gh-pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (if needed)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (if present)
        run: |
          if [ -f package-lock.json ] || [ -f package.json ]; then
            npm ci || npm install
          else
            echo "No package.json found — skipping npm install"
          fi

      - name: Build site (if you have a build step, replace this)
        run: |
          # If you have a build script, run it here (e.g. npm run build)
          echo "No build step configured — publishing repository files"

      - name: Copy site files to out/ (exclude repo internals & tests)
        run: |
          rm -rf out || true
          mkdir out
          # Use rsync to copy everything except excluded paths
          rsync -av --progress \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='test-results' \
            --exclude='test-screenshots' \
            --exclude='*.tar.gz' \
            --exclude='out' \
            ./ out/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
